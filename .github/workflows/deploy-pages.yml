name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/nisan-daveti-website-90gtyb"]
  workflow_dispatch:

# Pages dağıtımı için gerekli izinler
permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek dağıtım
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pages'i (kapalıysa) etkinleştir ve yapılandır
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Tüm statik siteyi (CNAME, assets, fontlar dâhil) yükle
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
